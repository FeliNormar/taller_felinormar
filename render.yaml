services:
  - type: web
    name: taller-felinormar
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/setup_db.py
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true   # Render genera una clave aleatoria automáticamente
      - key: PYTHON_VERSION
        value: 3.11.0
