<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Contraseña — Taller Felinormar</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #0d0f13; color: #e8ecf4;
      font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,174,239,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,174,239,.04) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }
    .card {
      background: #14171e; border: 1px solid #252a38; border-radius: 16px;
      padding: 40px; width: 100%; max-width: 400px;
      position: relative; z-index: 1; box-shadow: 0 40px 80px rgba(0,0,0,.5);
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand-icon { font-size: 40px; margin-bottom: 12px; }
    .brand-name { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 24px; color: #00AEEF; }
    .brand-sub { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #7a8299; margin-top: 4px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 500; color: #7a8299; letter-spacing: .3px; margin-bottom: 6px; }
    input {
      width: 100%; background: #1c2030; border: 1px solid #252a38;
      border-radius: 8px; color: #e8ecf4; padding: 11px 14px;
      font-size: 14px; font-family: inherit; transition: border-color .15s, box-shadow .15s;
    }
    input:focus { outline: none; border-color: #00AEEF; box-shadow: 0 0 0 3px rgba(0,174,239,.15); }
    .btn { width: 100%; padding: 12px; background: #00AEEF; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: 'Syne', sans-serif; cursor: pointer; margin-top: 8px; transition: background .15s; }
    .btn:hover { background: #0098D1; }
    .msg-error { background: rgba(231,76,60,.12); border: 1px solid rgba(231,76,60,.3); color: #f87171; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">🔒</div>
      <div class="brand-name">FELINORMAR</div>
      <div class="brand-sub">Nueva Contraseña</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="msg-error">⚠ {{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>Nueva Contraseña</label>
        <input type="password" name="password" placeholder="Mínimo 6 caracteres" required autofocus>
      </div>
      <div class="form-group">
        <label>Confirmar Contraseña</label>
        <input type="password" name="password_confirm" placeholder="Repite la contraseña" required>
      </div>
      <button type="submit" class="btn">Guardar nueva contraseña →</button>
    </form>
  </div>
</body>
</html>
